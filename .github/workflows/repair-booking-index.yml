name: Repair Booking Pack index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good index and apply only intended wording
        run: |
          git show 194a13009798c9852a3b8cbc354abb564dfab0f7:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          old_signoff = '<p class="hire-intro-signoff"><strong>Ngā mihi nui,<br>Waimarino Shears</strong></p>'
          new_signoff = '<p class="hire-intro-signoff"><strong>Noho ora mai,<br>Waimarino Shears</strong></p>'
          old_entry = '<li>Competition entry forms, if required, to assist with competitor entries</li>'
          new_entry = '<li>Online competitor entry and competition entry management system, allowing competitors to enter online, organisers to add manual entries, and manage competitor registrations in one place</li>'
          assert text.count(old_signoff) == 1, f'Expected one signoff, found {text.count(old_signoff)}'
          assert text.count(old_entry) == 1, f'Expected one entry bullet, found {text.count(old_entry)}'
          text = text.replace(old_signoff, new_signoff)
          text = text.replace(old_entry, new_entry)
          p.write_text(text)
          PY
      - name: Verify only the two intended wording changes versus known-good source
        run: |
          git diff --no-index <(git show 194a13009798c9852a3b8cbc354abb564dfab0f7:index.html) index.html > /tmp/index.diff || true
          cat /tmp/index.diff
          additions=$(grep -c '^+' /tmp/index.diff || true)
          deletions=$(grep -c '^-' /tmp/index.diff || true)
          test "$additions" -eq 3
          test "$deletions" -eq 3
      - name: Commit repair
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "Turiedmonds"
          git config user.email "turi-edmonds@hotmail.com"
          git add index.html
          git commit -m "Restore working Booking Pack index and apply wording"
          git push
