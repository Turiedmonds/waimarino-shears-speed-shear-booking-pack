name: Repair Booking Pack documentation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full documentation and add repair record
        run: |
          git show 194a13009798c9852a3b8cbc354abb564dfab0f7:PROJECT_STATE.md > PROJECT_STATE.md
          git show 194a13009798c9852a3b8cbc354abb564dfab0f7:CHANGELOG.md > CHANGELOG.md
          python - <<'PY'
          from pathlib import Path

          ps = Path('PROJECT_STATE.md')
          text = ps.read_text()
          text = text.replace('**Last updated:** 29 August 2026', '**Last updated:** 30 August 2026', 1)
          anchor = '- The shared `ENTRY_MANAGER_SHARED_SECRET` was rotated on **29 August 2026** in both the Booking Receiver and Speed Shear Entry Manager Apps Script projects. The replacement value is intentionally not recorded in GitHub or chat.\n'
          addition = anchor + '- Step 1 Hire Information now signs off **“Noho ora mai,”** followed by **Waimarino Shears**.\n- Step 1 **What we provide** now includes: **Online competitor entry and competition entry management system, allowing competitors to enter online, organisers to add manual entries, and manage competitor registrations in one place.**\n- On 30 August 2026 an accidental broad `index.html` replacement was repaired by restoring the exact known-good source from commit `194a13009798c9852a3b8cbc354abb564dfab0f7` and reapplying only the two intended wording changes. The repaired `index.html` was verified against that known-good source as exactly **2 additions / 2 deletions**.\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, addition, 1)
          ps.write_text(text)

          cl = Path('CHANGELOG.md')
          text = cl.read_text()
          marker = '## 29 August 2026\n'
          entry = '''## 30 August 2026\n\n### Hire Information wording and index repair\n\n- Changed the Step 1 introduction sign-off from **“Ngā mihi nui,”** to **“Noho ora mai,”** above **Waimarino Shears**.\n- Replaced **“Competition entry forms, if required, to assist with competitor entries”** with **“Online competitor entry and competition entry management system, allowing competitors to enter online, organisers to add manual entries, and manage competitor registrations in one place.”**\n- Corrected an accidental broad `index.html` replacement by restoring the exact known-good file from commit `194a13009798c9852a3b8cbc354abb564dfab0f7` and reapplying only those two wording changes.\n- Verified the repaired `index.html` differs from that known-good source by exactly **2 additions and 2 deletions**.\n- This is a GitHub Pages frontend change only; no Booking Receiver Apps Script deployment is required.\n\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, entry + marker, 1)
          cl.write_text(text)
          PY
      - name: Commit documentation repair
        run: |
          if git diff --quiet -- PROJECT_STATE.md CHANGELOG.md; then
            exit 0
          fi
          git config user.name "Turiedmonds"
          git config user.email "turi-edmonds@hotmail.com"
          git add PROJECT_STATE.md CHANGELOG.md
          git commit -m "Restore full Booking Pack documentation and record repair"
          git push
